{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Contact - RenovateEnergy</title>

    <link rel="stylesheet" href="{% static 'css/contact.css' %}" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  
</head>

<body class="contact-body">

    <header class="contact-header">
        <div class="contact-header-inner">
            <a href="{% url 'home' %}" class="contact-brand">
                <div class="contact-logo">
                    <span class="material-symbols-outlined">energy_savings_leaf</span>
                </div>
                <h2 class="contact-brand-title">RenovateEnergy</h2>
            </a>

            <nav class="contact-nav">
                <a href="{% url 'home' %}">Accueil</a>
                <a href="{% url 'about' %}">À propos</a>
                <a href="{% url 'contact' %}" class="active">Contact</a>
            </nav>

            <div class="contact-actions">
                <a href="{% url 'login' %}" class="contact-btn-secondary">Connexion</a>
                <a href="{% url 'login' %}" class="contact-btn-primary">Inscription</a>
            </div>
        </div>
    </header>

    <main class="contact-main">
        <section class="team-section">
            <h2 class="team-title">Notre Équipe</h2>
            <div class="team-title-underline"></div>

            <div class="team-grid">
                <!-- Sophie -->
                <article class="team-card">
                    <div class="team-avatar-wrapper">
                        <img src="https://i.pravatar.cc/300?u=sophie" class="team-avatar" alt="Sophie Martin">
                    </div>
                    <h3 class="team-name">Sophie Martin</h3>
                    <span class="team-role">Responsable QA</span>
                    <button class="team-btn">Voir CV</button>
                </article>

                <!-- Thomas -->
                <article class="team-card">
                    <div class="team-avatar-wrapper">
                        <img src="https://i.pravatar.cc/300?u=thomas" class="team-avatar" alt="Thomas Dubois">
                    </div>
                    <h3 class="team-name">Thomas Dubois</h3>
                    <span class="team-role">Chef de projet</span>
                    <button class="team-btn">Voir CV</button>
                </article>

                <!-- Julien -->
                <article class="team-card">
                    <div class="team-avatar-wrapper">
                        <img src="https://i.pravatar.cc/300?u=julien" class="team-avatar" alt="Julien Lefevre">
                    </div>
                    <h3 class="team-name">Julien Lefevre</h3>
                    <span class="team-role">Dev Back-end</span>
                    <button class="team-btn">Voir CV</button>
                </article>

                <!-- Nicolas -->
                <article class="team-card">
                    <div class="team-avatar-wrapper">
                        <img src="https://i.pravatar.cc/300?u=nicolas" class="team-avatar" alt="Nicolas Moreau">
                    </div>
                    <h3 class="team-name">Nicolas Moreau</h3>
                    <span class="team-role">Concepteur logiciel</span>
                    <button class="team-btn">Voir CV</button>
                </article>
            </div>
        </section>

        <section class="contact-form-section">
            <h1 class="contact-form-title">Contactez-nous</h1>
            <div class="contact-form-card">
                <form class="contact-form">
                    <div class="contact-form-row">
                        <input class="contact-input" placeholder="Votre Nom">
                        <input class="contact-input" placeholder="Votre Email">
                    </div>
                    <input class="contact-input" placeholder="Sujet de votre message">
                    <textarea class="contact-textarea" placeholder="Votre Message"></textarea>
                    <div class="contact-submit-wrapper">
                        <button class="contact-submit-btn">Envoyer le message</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>

</html>
