<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Connexion - RenovateEnergy</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="brand-section">
            <a href="home.html" class="brand-link">
                <div class="brand-icon-wrapper">
                    <span class="material-symbols-outlined brand-icon">energy_savings_leaf</span>
                </div>
                <h1 class="brand-title">RenovateEnergy</h1>
            </a>
        </div>

        <div class="auth-card">
            <button onclick="window.history.back()" class="close-btn">
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="tab-container">
                <button id="loginTab" onclick="switchMode('login')" class="tab-btn active">Connexion</button>
                <button id="registerTab" onclick="switchMode('register')" class="tab-btn">Créer un compte</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" onsubmit="return false">
                <div class="form-field">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">mail</span>
                        <input type="email" class="auth-input" placeholder="votre@email.com">
                    </div>
                </div>
                <div class="form-field">
                    <label class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input type="password" class="auth-input" placeholder="••••••••">
                    </div>
                </div>
                <div class="submit-section">
                    <a href="dashboard.html" class="btn-submit">
                        Se connecter
                    </a>
                </div>
                <p class="form-footer">
                    Pas encore de compte ? <a href="javascript:switchMode('register')">Créer un compte</a>
                </p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden" onsubmit="return false">
                <div class="form-field">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">mail</span>
                        <input type="email" class="auth-input" placeholder="votre@email.com">
                    </div>
                </div>
                <div class="form-field">
                    <label class="form-label">Mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input type="password" class="auth-input" placeholder="••••••••">
                    </div>
                </div>
                <div class="form-field">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">verified_user</span>
                        <input type="password" class="auth-input" placeholder="••••••••">
                    </div>
                </div>
                <div class="submit-section">
                    <button type="submit" class="btn-submit">
                        Créer un compte
                    </button>
                </div>
                <p class="form-footer">
                    Déjà membre ? <a href="javascript:switchMode('login')">Se connecter</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        function switchMode(mode) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
