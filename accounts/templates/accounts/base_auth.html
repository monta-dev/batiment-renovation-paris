{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{% block title %}{% endblock %} - RenovateEnergy</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body class="login-body">
    <div class="login-container">
        <div class="brand-section">
            <a href="/" class="brand-link">
                <div class="brand-icon-wrapper">
                    <span class="material-symbols-outlined brand-icon">energy_savings_leaf</span>
                </div>
                <h1 class="brand-title">RenovateEnergy</h1>
            </a>
        </div>

        <div class="auth-card">
            <button onclick="window.history.back()" class="close-btn">
                <span class="material-symbols-outlined">close</span>
            </button>
            
            {% block content %}{% endblock %}
            {% if messages %}
    {% for message in messages %}
        <div class="alert {{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}
        </div>
    </div>
</body>
</html>
